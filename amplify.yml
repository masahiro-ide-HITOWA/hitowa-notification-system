version: 1
applications:
  - appRoot: apps/web
    frontend:
      # Install and build from the npm-workspaces repo root.
      # artifacts.baseDirectory is relative to this path.
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - npm ci
        build:
          commands:
            - npm run build --workspace=@hitowa/web
      artifacts:
        # Next.js App Router / SSR: deploy the .next output, not a static `out/` folder.
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
          - apps/web/.next/cache/**/*
